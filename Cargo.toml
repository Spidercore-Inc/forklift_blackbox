[package]
name = "blackbox"
version = "0.1.0"
edition = "2021"

[dependencies]
iced = { version = "0.12.0", features = ["debug", "image", "advanced"] }
sysinfo = "0.33.1"
fs_extra = "1.3.0"
notify = "8.0.0"
tokio = { version = "1.43.0", features = ["sync"] }
glib = "0.20.6"
gstreamer = { package = "gstreamer", git = "https://gitlab.freedesktop.org/gstreamer/gstreamer-rs" }
gstreamer-base = { package = "gstreamer-base", git = "https://gitlab.freedesktop.org/gstreamer/gstreamer-rs" }
gstreamer-video = { package = "gstreamer-video", git = "https://gitlab.freedesktop.org/gstreamer/gstreamer-rs" }
gstreamer-app = { package = "gstreamer-app", git = "https://gitlab.freedesktop.org/gstreamer/gstreamer-rs" }
chrono = "0.4.39"
log = "0.4.22"
simplelog = "0.12.2"
time = "0.3.37"